<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Comments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            margin: 3rem;
            padding: 2rem;
            border: 1px solid #ccc;
        }

        .comment {
            padding-left: 1rem;
            border-left: 1px solid #000;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            position: relative;
        }

        .reply,
        .send {
            width: 3rem;
        }

        .new {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .new textarea {
            width: 100%;
        }

        .hide {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
    </div>
</body>

<script>
    let comments = JSON.parse(localStorage.getItem('comments')) || [
        {
            id: 1,
            title: "Hi, how are you doing?",
            replies: [
                {
                    id: 2,
                    title: "I'm good, thanks! How about you?",
                    replies: [
                        {
                            id: 3,
                            title: "Doing well, just busy with work.",
                            replies: []
                        }
                    ]
                },
                {
                    id: 4,
                    title: "Hey! Long time no see.",
                    replies: []
                }
            ]
        },
        {
            id: 5,
            title: "Hello everyone!",
            replies: []
        }
    ];
    const containerRef = document.querySelector('.container');

    const createCommentCard = (id, title, parentRef) => {

        const commentRef = document.createElement('div');
        commentRef.classList.add('comment');
        commentRef.setAttribute('id', id);

        commentRef.innerHTML = `
        <div class="title">${id}. ${title}</div>
        <button class="reply">Reply</button>
        <div class="new hide">
            <textarea placeholder="Enter your comment..."></textarea>
            <button class="send">Send</button>
        </div>
        `;

        const replyButtonRef = commentRef.querySelector('.reply');
        const replyRef = commentRef.querySelector('.new');
        const replyCommentRef = commentRef.querySelector('textarea');
        const sendButtonRef = commentRef.querySelector('.send');

        let replyContent = '';

        replyButtonRef.addEventListener('click', e => {
            replyRef.classList.toggle('hide');
        })

        replyCommentRef.addEventListener('input', e => {
            replyContent = e.target.value;
        })

        sendButtonRef.addEventListener('click', e => {
            updateComments(commentRef, replyContent);
        })

        parentRef.appendChild(commentRef);
        return commentRef;
    }

    const updateComments = (commentRef, content) => {
        const replyId = Math.trunc(Math.random() * 10000);
        const replyTitle = content;
        const newReply = {
            id: replyId,
            title: replyTitle,
            replies: []
        }

        const id = commentRef.getAttribute('id');
        findComment(comments, id, newReply);
        localStorage.setItem('comments', JSON.stringify(comments));
        loadComments();
    }

    const findComment = (comments, id, reply) => {

        comments.forEach(comment => {

            if (comment.id == id) {

                comment.replies.unshift(reply);
                return;
            }

            else {
                findComment(comment.replies, id, reply);
            }
        })
    }

    const renderComments = (comments, parentRef) => {

        comments.forEach(comment => {

            const commentRef = createCommentCard(comment.id, comment.title, parentRef);

            if (comment?.replies)
                renderComments(comment.replies, commentRef);
        })
    }

    const loadComments = () => {
        containerRef.innerHTML = ``;
        renderComments(comments, containerRef);
    }

    loadComments();
</script>

</html>

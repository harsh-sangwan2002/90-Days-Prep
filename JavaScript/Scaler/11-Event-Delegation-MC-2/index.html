<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Comments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            margin: 3rem;
            padding: 2rem;
            border: 1px solid #ccc;
        }

        .comment {
            padding-left: 1rem;
            border-left: 1px solid #000;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            position: relative;
        }

        .reply,
        .send {
            width: 3rem;
        }

        .new {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .new textarea {
            width: 100%;
        }

        .hide {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
    </div>
</body>

<script>
    const comments = [
        {
            id: 1,
            title: "1. Hi, how are you doing?",
            replies: [
                {
                    id: 2,
                    title: "2. I'm good, thanks! How about you?",
                    replies: [
                        {
                            id: 3,
                            title: "3. Doing well, just busy with work.",
                            replies: []
                        }
                    ]
                },
                {
                    id: 4,
                    title: "4. Hey! Long time no see.",
                    replies: []
                }
            ]
        },
        {
            id: 5,
            title: "5. Hello everyone!",
            replies: []
        }
    ]
    const containerRef = document.querySelector('.container');

    const createCommentCard = (id, title, parentRef) => {

        const commentCardRef = document.createElement('div');
        commentCardRef.classList.add('comment');
        commentCardRef.setAttribute('id', id);

        commentCardRef.innerHTML = `
        <div class="title">${title}</div>
        <button class="reply">Reply</button>
        <div class="new hide">
            <textarea placeholder="Enter your comment"></textarea>
            <button class="send">Send</button>
        </div>
        `;

        const replyButtonRef = commentCardRef.querySelector('.reply');
        const newCommentRef = commentCardRef.querySelector('.new');
        replyButtonRef.addEventListener('click', e => {
            newCommentRef.classList.toggle('hide');
        })

        parentRef.appendChild(commentCardRef);

        return commentCardRef;
    }

    const renderComments = (comments, parentRef) => {
        comments?.forEach(comment => {
            const commentRef = createCommentCard(comment.id, comment.title, parentRef);

            if (comment?.replies)
                renderComments(comment.replies, commentRef);
        })
    }

    const render = () => {
        containerRef.innerHTML = ``;
        renderComments(comments, containerRef);
    }
    render();
</script>

</html>

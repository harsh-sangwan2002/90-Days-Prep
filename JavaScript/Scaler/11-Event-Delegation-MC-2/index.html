<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Comments</title>
    <style>
        .container,
        .comment,
        .new {
            display: flex;
            flex-direction: column;
        }

        .comment {
            padding: 10px;
            border-left: 1px solid #ccc;
            gap: 5px;
            position: relative;
        }

        .comment,
        .new {
            margin-left: 50px;
        }

        .comment button {
            width: 50px;
        }

        .new {
            align-items: flex-start;
        }

        textarea {
            width: 100%;
        }

        .hide {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
    </div>
</body>

<script>
    const comments = [
        {
            id: 1,
            title: "1. Hi, how are you doing?",
            replies: [
                {
                    id: 2,
                    title: "2. I'm good, thanks! How about you?",
                    replies: [
                        {
                            id: 3,
                            title: "3. Doing well, just busy with work.",
                            replies: []
                        }
                    ]
                },
                {
                    id: 4,
                    title: "4. Hey! Long time no see.",
                    replies: []
                }
            ]
        },
        {
            id: 5,
            title: "5. Hello everyone!",
            replies: []
        }
    ]
    const container = document.querySelector('.container');

    function createCommentCard(parentRef, id, title) {

        const commentCard = document.createElement('div');
        commentCard.classList.add('comment');
        commentCard.id = id;
        commentCard.innerHTML = `
        <div class="title">${title}</div>
            <button class="reply">Reply</button>
            <div class="new hide">
                <textarea placeholder="Enter your comment"></textarea>
                <button class="send">Send</button>
            </div>
        `;

        parentRef.appendChild(commentCard);
        return commentCard;
    }

    function renderComments(comments, parentRef) {
        comments?.forEach(comment => {
            const commentCard = createCommentCard(parentRef, comment.id, comment.title);

            if (comment?.replies) renderComments(comment.replies, commentCard);
        })
    }

    function render() {
        container.innerHTML = '';
        renderComments(comments, container);
    }

    container.addEventListener('click', e => {
        if (e.target.classList.contains('reply')) {
            const commentRef = e.target.closest('.comment');
            const newRef = commentRef.querySelector('.new');
            newRef.classList.toggle('hide');
        }

        if (e.target.classList.contains('send')) {
            const commentRef = e.target.closest('.comment');
            const newReplyTitle = commentRef.querySelector('textarea').value;
            const parentId = commentRef.id;
            const newReplyId = Math.floor(Math.random() * Date.now());

            addNewReply(comments, parentId, newReplyId, newReplyTitle);
        }
    })

    render();
</script>

</html>

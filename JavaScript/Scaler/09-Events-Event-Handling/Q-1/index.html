<!DOCTYPE html>
<html lang="en">

<head>

    <title>Book My Show</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            margin-top: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .movies {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .movie {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            width: 150px;
            height: 150px;
            font-weight: bold;
            position: relative;
        }

        .title {
            padding: 0.2rem;
            background-color: black;
            width: 100%;
            text-align: center;
        }

        .price {
            background-color: chocolate;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1.5rem;
        }

        .remove-icon {
            cursor: pointer;
            border-radius: 50%;
            background-color: red;
            padding: 0.5rem;
            position: absolute;
            top: -15px;
            right: -15px;
        }
    </style>
</head>

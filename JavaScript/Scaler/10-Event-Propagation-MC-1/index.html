<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <style>
        .container,
        .quantity,
        .row {
            display: flex;
            gap: 10px;
        }

        .container {
            flex-direction: column;
        }

        .row,
        .container {
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <h1>Counter</h1>
    <div class="container">
        <div class="row">
            <div class="title">Apple</div>
            <div class="quantity">
                <button class="btn-minus">-</button>
                <span class="count">0</span>
                <button class="btn-plus">+</button>
            </div>
        </div>
        <div class="row">
            <div class="title">Banana</div>
            <div class="quantity">
                <button class="btn-minus">-</button>
                <span class="count">0</span>
                <button class="btn-plus">+</button>
            </div>
        </div>
        <div class="row">
            <div class="title">Orange</div>
            <div class="quantity">
                <button class="btn-minus">-</button>
                <span class="count">0</span>
                <button class="btn-plus">+</button>
            </div>
        </div>
    </div>
</body>

<script>
    const container = document.querySelector('.container');

    container.addEventListener('click', e => {
        // console.log("container-> ", e.target);
        if (e.target.classList.contains('btn-plus')) {
            const countRef = e.target.closest('.quantity').querySelector('.count');
            let count = parseInt(countRef.innerText);
            count++;
            countRef.innerText = count;
        }

        if (e.target.classList.contains('btn-minus')) {
            const countRef = e.target.closest('.quantity').querySelector('.count');
            let count = parseInt(countRef.innerText);
            if (count > 0) {
                count--;
                countRef.innerText = count;
            }
        }
    })

    // document.addEventListener('click', e => {
    //     console.log("document-> ", e.target);
    // })
</script>

</html>

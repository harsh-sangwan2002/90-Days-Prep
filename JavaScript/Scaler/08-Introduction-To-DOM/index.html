<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <script src="script.js"></script>
    <style>
        .randomNumberContainer {
            padding: 3rem;
            border: 1px solid black;
            color: green;
            text-align: center;
            font-size: 3rem;
        }
    </style>
</head>

<body>
    <h1 class="heading">DOM</h1>

    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>

    <div class="container">
        <div class="parent">
            <ul>
                <li>Child 1</li>
                <li>Child 2</li>
            </ul>
        </div>
    </div>

    <div class="parent">
        Hello
        <p>Some more details</p>
        <a href="https://kodekarma.dev">Kode Karma</a>
    </div>

    <div class="randomNumberContainer">

    </div>

    <button>Show Random Number</button>
</body>

<script>
    // var title = "Scaler JS Class"
    // console.log(title);
    // console.log(document.getElementsByClassName('parent')[0].innerText);
    const divRef = document.querySelector('.randomNumberContainer');
    const buttonRef = document.querySelector('button');

    const showRandomNumber = () => {
        const randomNumber = Math.trunc(Math.random() * 100);
        divRef.innerText = randomNumber;
    }
    buttonRef.addEventListener('click', e => {
        showRandomNumber();
    })
</script>

</html>

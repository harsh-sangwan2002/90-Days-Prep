<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1</title>
</head>

<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>

        <li>8</li>
        <li>9</li>
        <li>10</li>
    </ul>
</body>

<script>
    // Fix the list
    const ul = document.querySelector('ul');
    const seven = document.createElement('li');
    seven.textContent = '7';
    const eight = document.querySelectorAll('li')[6];

    ul.insertBefore(seven, eight);
</script>

</html>

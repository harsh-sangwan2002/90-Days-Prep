<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix the list</title>
</head>

<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>8</li>
        <li>9</li>
        <li>10</li>
    </ul>
</body>

<script>
    const list = document.querySelector('ul');
    const childNode = document.querySelectorAll('li')[6];

    const newNode = document.createElement('li');
    newNode.innerText = 7;
    list.insertBefore(newNode, childNode);

</script>

</html>

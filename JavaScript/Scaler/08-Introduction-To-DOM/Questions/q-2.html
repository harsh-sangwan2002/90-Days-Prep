<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<body>
    <div>
        <span class="var1">5</span>
        <span class="operator">+</span>
        <span class="var2">10</span>
        <span>=</span>
        <span class="result"></span>
    </div>
</body>

<script>
    const val1 = Number(document.querySelector('.var1').innerText);
    const val2 = Number(document.querySelector('.var2').innerText);
    let ans = 0;
    const res = document.querySelector('.result');
    const operator = document.querySelector('.operator').innerText;

    switch (operator) {
        case "+":
            ans = val1 + val2;
            break;

        case "-":
            ans = val1 - val2;
            break;

        case "*":
            ans = val1 * val2;
            break;

        case "/":
            ans = val1 / val2;
            break;
    }

    res.innerText = ans;
</script>

</html>

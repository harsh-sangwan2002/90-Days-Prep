<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>
</head>

<body>
    <div>
        <span class="var1">5</span>
        <span class="operator">+</span>
        <span class="var2">10</span>
        <span>=</span>
        <span class="result"></span>
    </div>

    <button>Calculate</button>
</body>

<script>
    const val1 = parseInt(document.querySelector('.var1').innerText);
    const operator = document.querySelector('.operator').innerText;
    const val2 = parseInt(document.querySelector('.var2').innerText);
    const res = document.querySelector('.result');
    const buttonRef = document.querySelector('button');

    console.log(val1, val2);

    buttonRef.addEventListener('click', function () {

        let val = 0;

        switch (operator) {
            case "+":
                val = val1 + val2;
                break;

            case "-":
                val = val2 - val1;
                break;

            case "*":
                val = val1 * val2;
                break;

            case "/":
                val = val2 / val1;
                break;

            default:
                val = "Operator not allowed";
                break;
        }

        res.innerText = val;
    })
</script>

</html>

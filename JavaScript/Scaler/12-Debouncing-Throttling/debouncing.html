<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debouncing</title>
</head>

<body>
    <input type="text">
    <ul>
        <li>Item 1</li>
    </ul>
</body>

<script>

    const inputRef = document.querySelector('input');

    async function fetchProducts(e) {
        const value = e.target.value;

        const res = await fetch(`https://fakestoreapi.com/products?query=${value}`);
        console.log(res);
    }

    /* Debouncing executes function only once after a certain delay has passed since the last event. 
    
    Use cases:
        1) Searchbar API call
        2) Auto-save after typing stops
        3) Form Validation
        4) Expensive calculation
    */
    function debounce(fn, delay) {
        let timerId;

        return function (...args) {

            clearTimeout(timerId);

            timerId = setTimeout(() => {
                fn(...args);
            }, delay);
        }
    }

    const debouncedFetchProducts = throttle(fetchProducts, 1000);
    inputRef.addEventListener('keyup', debouncedFetchProducts);
</script>

</html>

<script>
    // console.log(this); // window

    function fn() {
        console.log(this); // window
    }
    // fn();

    let obj = {
        name: "John",
        test: function () {
            console.log(this); // obj
            function inner() {
                console.log(this); // window
            }
            inner();

            const arrow = () => {
                console.log(this); // obj
            }
            arrow();
        },
        arrow: () => {
            console.log(this); // window
        }
    }
    // obj.test();
    // obj.arrow();

    let newFn = obj.test;
    newFn(); // window

    let obj2 = {
        name: "Jane"
    }
    obj2.test = obj.test;
    // obj2.test(); // obj2

    const obj3 = {
        name: "John",
        test: function () {
            function outer() {
                const inner = () => {
                    console.log(this); // window
                }
                inner();
            }
            outer();
        }
    }
    // obj3.test();
</script>

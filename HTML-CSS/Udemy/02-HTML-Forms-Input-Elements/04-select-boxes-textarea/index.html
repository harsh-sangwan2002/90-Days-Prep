<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Sandbox</title>
</head>

<body>
    <h1>HTML & CSS Sandbox - Input Field Attributes</h1>
    <form>
        <div>
            <label for="product">Product</label>
            <select name="product" id="product" multiple size="1">
                <option value="iphone">iPhone</option>
                <option value="imac">iMac</option>
                <option value="macBook">MacBook</option>
                <option value="macBook-pro">MacBook Pro</option>
            </select>
        </div>
        <br>

        <div>
            <label for="message">Message</label>
            <textarea name="message" id="message" placeholder="Enter your message" rows="4" cols="40"></textarea>
        </div>
        <br>

        <div>
            <button>Submit</button>
        </div>
    </form>
</body>

</html>

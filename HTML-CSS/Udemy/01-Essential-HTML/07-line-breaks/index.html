<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Sandbox</title>
</head>

<body>
    <h1>HTML & CSS Sandbox - Line breaks, Horizontal Rules & Entities</h1>
    <h1>
        <!-- Line breaks -->
        Hello <br><br><br>
        World
    </h1>

    <!-- Horizontal rules -->
    <p>This is the first paragraph</p>
    <hr>
    <p>This is the second paragraph</p>
    <p>Copyright &copy; 2025</p>

    <!-- pre tag -->
    <pre>Hello
        World
    </pre>

    <!-- code tag -->
    <code>
        &lt;h1&gt;This is a heading&lt;h1&gt;
     </code>

    <!-- HTML Entities -->

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Sandbox</title>
</head>

<body>
    <h1>HTML & CSS Sandbox - Images</h1>

    <!-- Relative path -->
    <img src="" alt="landscape">

    <!-- Absolute path -->
    <img src="https://picsum.photos/200/300" title="A beautiful landscape" alt="Random">

    <!-- Width & Height attribute -->
    <img src="" width="400" height="300" alt="Random">

    <!-- fig and figcaption -->
    <figure>
        <img src="https://picsum.photos/200/300" alt="Random">
        <figcaption>Fig.1 - Beautiful landscape</figcaption>
    </figure>
</body>

</html>

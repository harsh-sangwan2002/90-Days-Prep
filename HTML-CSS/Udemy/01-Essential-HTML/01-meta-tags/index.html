<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Specifies the character encoding -->
    <!-- Should be the first tag inside head -->
    <meta charset="UTF-8">

    <!-- Controls layout on different devices/screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Description is displayed in search results -->
    <!-- Description should be no more than 160 characters -->
    <meta name="description" content="Learn HTML & CSS from this cool course">
    <meta name="keywords" content="HTML, CSS, Web Development">
    <title>HTML & CSS Sandbox</title>
</head>

<body>
    <h1>HTML & CSS Sandbox - Meta Tags</h1>
</body>

</html>

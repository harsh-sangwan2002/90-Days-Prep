<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes & Ids</title>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <h1>My Website</h1>
        <ul class="nav">
            <li><a href="#">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>

    <!-- Sections -->
    <div id="about" class="card text-center">
        <h2 class="text-lg">Section One</h2>
        <p>This is the first paragraph in section <span>one</span></p>
        <p>This is the second paragraph in section <span class="secondary-text">one</span></p>
    </div>

    <div id="contact" class="card text-center">
        <h2 class="text-xl">Section Two</h2>
        <p>This is the first paragraph in section <span class="primary-text">two</span></p>
        <p>This is the second paragraph in section <span class="secondary-text">two</span></p>
    </div>

    <!-- Footer -->
    <div class="footer">
        &copy; 2025 My Website
    </div>
</body>

</html>

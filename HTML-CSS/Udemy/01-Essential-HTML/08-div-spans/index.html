<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div & Spans</title>
</head>

<body>
    <!-- Header -->
    <div>
        <h1>My Website</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>

    <!-- Sections -->
    <div>
        <h2>Section One</h2>
        <p>This is the first paragraph in section <span>one</span></p>
        <p>This is the second paragraph in section <span>one</span></p>
    </div>

    <div>
        <h2>Section Two</h2>
        <p>This is the first paragraph in section <span>two</span></p>
        <p>This is the second paragraph in section <span>two</span></p>
    </div>

    <!-- Footer -->
    <div>
        &copy; 2025 My Website
    </div>
</body>

</html>

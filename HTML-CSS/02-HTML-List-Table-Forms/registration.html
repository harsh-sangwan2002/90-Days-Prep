<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>
    <form action="">
        <!-- Name -->
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
        </div>

        <!-- Contact -->
        <div class="form-group">
            <label for="contact">Contact</label>
            <input type="text" id="contact" name="contact" placeholder="Enter your contact">
        </div>

        <!-- Degree -->
        <div class="form-group">
            <label for="degree">Degree</label>
            <select name="degree" id="degree">
                <option value="bachelor">Bachelor's</option>
                <option value="master">Master's</option>
                <option value="phd">PhD</option>
            </select>
        </div>

        <!-- Graduation Date -->
        <div class="form-group">
            <label for="graduation-date">Graduation Date</label>
            <input type="date" id="graduation-date" name="graduation-date">
        </div>

        <!-- Query -->
        <div class="form-group">
            <label for="query">Query</label>
            <textarea id="query" name="query" rows="4" placeholder="Enter your query"></textarea>
        </div>

        <!-- Gender -->
        <div class="form-group">
            <span>Gender</span>
            <div>
                <label for="male">Male</label>
                <input type="radio" name="gender" value="male">

                <label for="female">Female</label>
                <input type="radio" name="gender" value="female">

                <label for="other">Other</label>
                <input type="radio" name="gender" value="other">
            </div>
        </div>

        <!-- Profile Photo -->
        <div class="form-group">
            <label for="profile-photo">Profile Photo</label>
            <input type="file" id="profile-photo" name="profile-photo">
        </div>

        <button type="submit">Register</button>
    </form>
</body>

</html>

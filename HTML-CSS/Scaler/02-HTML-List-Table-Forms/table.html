<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>

<body>
    <table border style="border-collapse: collapse;">
        <caption>Transaction Details</caption>
        <thead>
            <tr>
                <th>Date</th>
                <th>Purpose</th>
                <th>Credit</th>
                <th>Debit</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">30th March</td>
                <td>Laptop</td>
                <td></td>
                <td>200000</td>
            </tr>
            <tr>
                <td>iPhone</td>
                <td></td>
                <td>100000</td>
            </tr>
            <tr>
                <td>31st March</td>
                <td>Salary</td>
                <td>400000</td>
                <td></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2"><b><i>Total</i></b></td>
                <td><i>400000</i></td>
                <td><i>300000</i></td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
